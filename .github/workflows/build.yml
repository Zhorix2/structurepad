name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # macOS убран
        build-type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    # Кэширование vcpkg
    - name: Cache vcpkg
      uses: actions/cache@v4
      id: cache-vcpkg
      with:
        path: |
          ./vcpkg
          !./vcpkg/buildtrees
          !./vcpkg/packages
          !./vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Clone vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: git clone https://github.com/Microsoft/vcpkg.git ./vcpkg

    # Bootstrap для Windows
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: vcpkg\bootstrap-vcpkg.bat
      shell: cmd

    # Bootstrap для Linux
    - name: Bootstrap vcpkg (Linux)
      if: runner.os == 'Linux'
      run: ./vcpkg/bootstrap-vcpkg.sh
      shell: bash

    # Установка зависимостей (Windows)
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg\vcpkg.exe install --triplet x64-windows
      shell: cmd

    # Установка зависимостей (Linux)
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: ./vcpkg/vcpkg install --triplet x64-linux
      shell: bash

    # Конфигурация и сборка (Windows)
    - name: Configure and Build (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build . --config ${{ matrix.build-type }} --parallel 2
      shell: cmd

    # Конфигурация и сборка (Linux)
    - name: Configure and Build (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux
        cmake --build . --config ${{ matrix.build-type }} --parallel 2
      shell: bash

    # Проверка существования исполняемого файла (Windows)
    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: dir build\${{ matrix.build-type }}\*.exe
      shell: cmd

    # Проверка для Linux
    - name: Test executable exists (Linux)
      if: runner.os == 'Linux'
      run: ls -la build/structurepad || ls -la build/
      shell: bash

    # --- Загрузка артефактов ---
    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: structurepad-windows-${{ matrix.build-type }}
        path: build\${{ matrix.build-type }}\structurepad.exe

    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: structurepad-linux-${{ matrix.build-type }}
        path: build/structurepad
