name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Install dependencies on macOS
      if: runner.os == 'macOS'
      run: brew install cmake

    # Кэширование vcpkg
    - name: Cache vcpkg
      uses: actions/cache@v4
      id: cache-vcpkg
      with:
        path: |
          ./vcpkg
          !./vcpkg/buildtrees
          !./vcpkg/packages
          !./vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Clone vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: git clone https://github.com/Microsoft/vcpkg.git ./vcpkg

    # Bootstrap для Windows – используем обратную косую черту
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: vcpkg\bootstrap-vcpkg.bat
      shell: cmd

    # Bootstrap для Unix
    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      run: ./vcpkg/bootstrap-vcpkg.sh
      shell: bash

    # Установка зависимостей через vcpkg (Windows)
    - name: Install dependencies with vcpkg (Windows)
      if: runner.os == 'Windows'
      run: vcpkg\vcpkg.exe install --triplet x64-windows
      shell: cmd

    # Установка зависимостей через vcpkg (Unix)
    - name: Install dependencies with vcpkg (Unix)
      if: runner.os != 'Windows'
      run: ./vcpkg/vcpkg install --triplet ${{ runner.os == 'macOS' && 'x64-osx' || 'x64-linux' }}
      shell: bash

    # Конфигурация и сборка (Windows)
    - name: Configure and Build (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build . --config ${{ matrix.build-type }} --parallel 2
      shell: cmd

    # Конфигурация и сборка (Unix)
    - name: Configure and Build (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ runner.os == 'macOS' && 'x64-osx' || 'x64-linux' }}
        cmake --build . --config ${{ matrix.build-type }} --parallel 2
      shell: bash

    # Проверка существования исполняемого файла (Windows)
    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: dir build\${{ matrix.build-type }}\*.exe
      shell: cmd

    # Проверка для Unix
    - name: Test executable exists (Unix)
      if: runner.os != 'Windows'
      run: ls -la build/bin/ || ls -la build/
      shell: bash
