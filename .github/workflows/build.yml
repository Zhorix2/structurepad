name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies on Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Install dependencies on macOS
      if: runner.os == 'macOS'
      run: |
        brew install cmake
    
    - name: Setup vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git vcpkg-repo
        cd vcpkg-repo
        git checkout c8696fbdd5fca8e3f762233bda7312ec386a9bef
    
    - name: Bootstrap vcpkg (Linux/macOS)
      if: runner.os != 'Windows'
      run: ./vcpkg-repo/bootstrap-vcpkg.sh
    
    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      run: .\vcpkg-repo\bootstrap-vcpkg.bat
    
    - name: Configure and Build (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg-repo/scripts/buildsystems/vcpkg.cmake"
        cmake --build . --config ${{ matrix.build-type }}
    
    - name: Configure and Build (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg-repo/scripts/buildsystems/vcpkg.cmake"
        cmake --build . --config ${{ matrix.build-type }}
    
    - name: Test executable exists
      run: |
        ls -la build/
